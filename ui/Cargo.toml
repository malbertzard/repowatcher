[package]
name = "rw-ui"
version = "0.1.0"
edition = "2024"

[package.metadata.leptos]
tailwind-input-file = "style/tailwind.css"

[dependencies]
rw-model = { path = "../crates/rw-model" }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_ui = "0.3"
tw_merge = "0.1"
strum = { version = "0.27", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "Headers", "WebSocket", "MessageEvent", "Window", "Location", "Document", "Element", "HtmlElement", "NodeList"] }
console_error_panic_hook = "0.1"
